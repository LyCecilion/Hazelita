name: Publish Release

on:
    push:
        tags:
            - "v*"

jobs:
    releases:
        runs-on: windows-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Publish CLI
              run: dotnet publish src/Hazelita.CLI/Hazelita.CLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: ./publish/*.exe
                  generate_release_notes: true
